[platformio]
default_envs = esp32-wroom32

[env:esp32-wroom32]
; Floor skeleton — bbtool codegen-composed root (see src/main.c,
; src/tm_wire.h, bbtool.toml). Boot + log + NVS + WiFi (STA from stored
; creds) only. No HTTP/OTA/provisioning/mining/stratum/ASIC/display/LED/
; webui yet. scripts/tm_codegen.py regenerates src/generated/ before
; every build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_esp32_4mb.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DFIRMWARE_BOARD=esp32-wroom32 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig/esp32-classic;sdkconfig/esp32-wroom32"
build_flags =
    -O3
    -ffunction-sections
    -fdata-sections
    -DBOARD_ESP32_WROOM32
    -DBB_HW_BOARD_HEADER=\"boards/esp32_wroom32.h\"
extra_scripts =
    pre:scripts/fetch_breadboard.py
    pre:.breadboard/scripts/bbtool_pio.py
    pre:scripts/tm_codegen.py
check_flags =
    cppcheck: --suppress=unusedFunction

[env:native]
; Host test env — the native/host-test seam, first wired live by tm_mining
; (TA-561v2 port). test_build_src = yes builds src/ (filtered below) linked
; against the test binary; component sources living OUTSIDE src/ are pulled
; in via relative build_src_filter patterns (mirrors breadboard's own
; examples/smoke native pattern, e.g. `+<../../../platform/host/...>`), not
; lib_extra_dirs -- there is no PlatformIO "library" wrapper here, just a
; direct relative path into components/tm_mining/src/. -I paths cover only
; what tm_mining's headers/sources actually include: its own include/, plus
; bb_core (bb_core.h/bb_byte_order.h/bb_format.h/bb_type.h), bb_serialize
; (bb_serialize.h), bb_log (bb_log.h, used from .c files, PRIV_REQUIRES), and
; bb_str (bb_str.h, hex codec used from work_build.c, PRIV_REQUIRES)
; from the vendored .breadboard checkout. tm_stratum/include is wired the
; same way -- work_build.c holds the stratum work-building primitives
; (build_coinbase_hash/build_merkle_root/serialize_header/
; decode_stratum_prevhash/difficulty_to_target), relocated verbatim out of
; tm_mining/work.c; it PRIV_REQUIRES tm_mining for sha256d(). Only tm_mining's
; host-safe sources are listed -- sha256_hw_dport.c (classic-ESP32 DPORT
; hardware backend) is entirely #ifdef ESP_PLATFORM/CONFIG_IDF_TARGET_ESP32
; gated and has no host test coverage, so it is excluded rather than
; compiled to an empty TU. bb_serialize_walk.c (bb_serialize_desc_find(),
; exercised by test_tm_mining_producer.c) and bb_str.c (bb_str_hex_to_bytes/
; bb_str_bytes_to_hex, exercised via work.c) are pulled in the same way -- a
; direct relative source path, not a full component build (their other .c
; files/PRIV_REQUIRES are unused by these tests). The
; tm_stratum (TA-560 port) extends the same pattern: its own include/, plus
; bb_fsm (bb_fsm.h/bb_fsm.c -- self-contained, REQUIRES bb_core only) and
; bb_serialize_json (bb_serialize_json.h -- the tok-recorder ingest API;
; only bb_serialize_json_scan.c + bb_serialize_json_tok.c are pulled in --
; the scan/record path stratum_machine.c/stratum_fsm.c actually drive. The
; render/populate/parse/format sources are NOT needed on this path and are
; excluded rather than compiled to unused TUs). stratum_transport_esp.c is
; excluded (ESP_PLATFORM-gated, references bb_tcp_client which is not wired
; on native -- the FSM tests use a transport-vtable fake instead).
; tm_pool_config (pool-subsystem PR1) extends the same pattern one more time:
; its own include/, plus bb_config (bb_config.h -- the typed field-table
; layer) and bb_storage (bb_storage.h -- the portable storage facade). Host
; tests register a fake "nvs" bb_storage backend (test/test_host/
; fake_nvs_backend.h, duplicated from breadboard's own copy) so
; tm_pool_config's production field tables (backend="nvs") round-trip
; against an in-memory stand-in rather than the ESP-IDF-only real backend --
; bb_storage_nvs itself is intentionally NOT pulled in here.
; tm_pool_stats (pool-subsystem PR2, TA-569) extends the same pattern once
; more: its own include/ only -- it reuses tm_pool_config's TM_POOL_MAX
; (tm_pool_cfg.h) and shares tm_pool_config's already-wired bb_config/
; bb_storage/fake-"nvs"-backend plumbing above, rather than duplicating any
; of it. The bb_timer periodic flush driver is ESP_PLATFORM-gated in src/
; tm_pool_stats.c and is NOT wired here -- only the host-testable flush
; LOGIC (tm_pool_stats_flush) is exercised on native. tm_pool_stats is
; internally synchronized via bb_core's bb_lock (bb_lock.h/bb_lock_once.h,
; already reachable via the existing bb_core/include -I above) -- its host
; backend (platform/host/bb_core/bb_lock.c, a pthread_mutex_t wrapper) plus
; the two platform-shared TUs it depends on (bb_lock_stats.c, bb_lock_once.c
; -- compiled once, linked into both host and ESP-IDF builds per their own
; header comments) are pulled in below. bb_lock.c's own private headers
; (bb_lock_impl.h, bb_lock_stats.h) live alongside it in platform/host/
; bb_core/ and resolve via GCC's default same-directory quote-include search
; -- no extra -I needed. tm_pool_stats's scoreboard (pool-subsystem PR3,
; TA-570, src/tm_pool_scoreboard.c) adds no new -I -- it reuses
; tm_pool_stats/include and bb_str (bb_str.h -- already wired above for
; work.c's floor()-adjacent extranonce2 hex codec use; bb_str.c is already
; in the +<> list below).
; tm_pool_client (pool-subsystem PR4, TA-571) is header-only (its own
; include/ added to -I above, no .c to pull in) -- it owns
; tm_pool_work_seam.h (tm_pool_work_ops_t), relocated here from tm_stratum
; (firmware review finding #1: protocol-agnostic, zero stratum-wire content,
; so it belongs to the abstraction owning the cross-core seam, not to any
; one protocol backend). tm_stratum's V1 adapter (stratum_pool_client.c,
; implementing tm_pool_client_ops_t over the existing stratum_fsm_* API) is
; pulled in the same way as the rest of tm_stratum's sources below -- it
; links on native but nothing composes/drives the adapter here yet (no live
; socket on host; host tests exercise stratum_fsm_* directly, same as
; before). The in-flight SUBMIT-id -> share-record payload that used to live
; in a separate stratum_share.c table is now folded into stratum_reqid.c's
; own table (finding #2 -- no more stratum_share.c to pull in).
; tm_pool_policy (pool-subsystem PR5, TA-572/TA-203) extends the same
; pattern once more: its own include/, plus the already-wired bb_config/
; bb_storage/fake-"nvs"-backend plumbing above (its field table also targets
; backend="nvs") and tm_pool_config (already wired -- TM_POOL_MAX,
; tm_pool_config_is_configured()). It reuses tm_pool_config's/tm_pool_stats's
; already-pulled-in bb_lock host backend (bb_lock.c/bb_lock_stats.c/
; bb_lock_once.c below) for its own internal synchronization -- no new
; pull-in needed. tm_pool_policy_tick() is externally driven (no internal
; bb_timer of its own -- see its header's file-level doc comment), so there
; is no ESP_PLATFORM-gated driver to exclude here, unlike tm_pool_stats's
; flush timer.
; next component to go host-testable extends
; this same build_src_filter/-I pattern; do not reintroduce native_scaffold.py
; or any other auto-derivation -- this env is hand-wired on purpose.
; -DUNITY_INCLUDE_DOUBLE (mirrors breadboard's own env:native) -- several
; mining tests assert doubles (TEST_ASSERT_DOUBLE_WITHIN etc.), which Unity
; drops to a build error without this.
; Always exclude -<main.c> (ESP-IDF entry point), -<tm_wire.c> (composition-
; root helpers -- calls bb_system_get_reset_reason()/bb_log_level_set() etc,
; ESP-IDF-coupled, not part of tm_mining's host-testable surface), and
; -<generated/*> (gitignored bbtool-codegen output, only present after an
; esp32-wroom32 build has run at least once -- ESP-IDF-only composition glue).
platform = native
test_framework = unity
test_filter = test_host
test_build_src = yes
extra_scripts =
    pre:scripts/fetch_breadboard.py
build_flags =
    -O0
    -std=gnu11
    -DUNITY_INCLUDE_DOUBLE
    ; tm_stratum's FSM arms 3 concurrent timers while RUNNING (job drought,
    ; share drought, keepalive-due) -- see stratum_fsm.c's on_enter_running().
    ; Native has no sdkconfig.h, so bb_fsm.h's CONFIG_BB_FSM_MAX_TIMERS bridge
    ; never sees the Kconfig value (sdkconfig.defaults's CONFIG_BB_FSM_MAX_
    ; TIMERS=3) unless mirrored here directly; the header's un-configured
    ; default (1) would otherwise silently drop the 2nd/3rd arm.
    -DCONFIG_BB_FSM_MAX_TIMERS=3
    -Isrc
    -Icomponents/tm_mining/include
    -Icomponents/tm_stratum/include
    -Icomponents/tm_pool_config/include
    -Icomponents/tm_pool_stats/include
    -Icomponents/tm_pool_client/include
    -Icomponents/tm_pool_policy/include
    -I.breadboard/components/bb_core/include
    -I.breadboard/components/bb_serialize/include
    -I.breadboard/components/bb_serialize_json/include
    -I.breadboard/components/bb_fsm/include
    -I.breadboard/components/bb_log/include
    -I.breadboard/components/bb_str/include
    -I.breadboard/components/bb_config/include
    -I.breadboard/components/storage/bb_storage/include
    -lm  # libm (floor() in work.c) — required on Linux CI, implicit on macOS
build_src_filter =
    +<*>
    -<main.c>
    -<tm_wire.c>
    -<generated/*>
    +<../components/tm_mining/src/mining.c>
    +<../components/tm_mining/src/tm_mining_producer.c>
    +<../components/tm_mining/src/mining_avg.c>
    +<../components/tm_mining/src/mining_pool_stats.c>
    +<../components/tm_mining/src/sha256.c>
    +<../components/tm_mining/src/share_validate.c>
    +<../components/tm_mining/src/work.c>
    +<../components/tm_stratum/src/work_build.c>
    +<../components/tm_stratum/src/stratum_backoff.c>
    +<../components/tm_stratum/src/stratum_machine.c>
    +<../components/tm_stratum/src/stratum_reqid.c>
    +<../components/tm_stratum/src/stratum_fsm.c>
    +<../components/tm_stratum/src/stratum_pool_client.c>
    +<../components/tm_stratum/src/stratum_producer.c>
    +<../components/tm_pool_config/src/tm_pool_config.c>
    +<../components/tm_pool_stats/src/tm_pool_stats.c>
    +<../components/tm_pool_stats/src/tm_pool_scoreboard.c>
    +<../components/tm_pool_policy/src/tm_pool_policy.c>
    +<../.breadboard/platform/host/bb_core/bb_lock.c>
    +<../.breadboard/platform/host/bb_core/bb_lock_stats.c>
    +<../.breadboard/platform/host/bb_core/bb_lock_once.c>
    +<../.breadboard/components/bb_serialize/src/bb_serialize_walk.c>
    +<../.breadboard/components/bb_serialize_json/src/bb_serialize_json_scan.c>
    +<../.breadboard/components/bb_serialize_json/src/bb_serialize_json_tok.c>
    +<../.breadboard/components/bb_fsm/bb_fsm.c>
    +<../.breadboard/platform/host/bb_str/bb_str.c>
    +<../.breadboard/platform/host/bb_config/bb_config.c>
    +<../.breadboard/platform/host/bb_storage/bb_storage.c>
