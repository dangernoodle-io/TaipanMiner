[platformio]
default_envs = esp32-wroom32

[env:esp32-wroom32]
; PR 1 skeleton — handwired composition root, boot + log only. No NVS/WiFi
; (blocked on breadboard B1-840 -- see src/main.c) /HTTP/OTA/provisioning/
; mining/stratum/ASIC/display/LED/webui yet.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_esp32_4mb.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DFIRMWARE_BOARD=esp32-wroom32 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig/esp32-classic;sdkconfig/esp32-wroom32"
build_flags =
    -O3
    -ffunction-sections
    -fdata-sections
    -DBOARD_ESP32_WROOM32
    -DBB_HW_BOARD_HEADER=\"boards/esp32_wroom32.h\"
extra_scripts =
    pre:scripts/fetch_breadboard.py
    pre:.breadboard/scripts/bbtool_pio.py
check_flags =
    cppcheck: --suppress=unusedFunction

[env:native]
; Host test env — the build_src_filter boundary for host-testable seams
; (stratum today; mining/other components extend this same env later).
;
; TA-560 settles the native-test wiring decision: a PLAIN PlatformIO native
; env (build_src_filter + manual -I include paths + lib_deps), matching this
; project's already-established "handwire" composition philosophy applied
; to build wiring too -- NOT breadboard's own `bbtool scaffold`/
; custom_bb_board mechanism. That mechanism resolves a `[board.*]` manifest
; against ONE root containing both `components/` and `platform/{host,espidf,
; arduino}/` (see breadboard's own bbtool.toml + scripts/bbtool/boards.py);
; it is wired to breadboard's OWN tree for breadboard's OWN dogfooding, and
; the manifest it reads lives in `.breadboard/bbtool.toml`, not something
; this project can extend for TM-local components (stratum) without either
; restructuring stratum into that host/espidf split (wrong shape for a
; single-platform-behind-a-thin-ops-vtable component) or duplicating the
; resolver against two roots. A future PR MAY revisit this if the native
; env's manually-curated file list becomes a real maintenance burden.
;
; The libraries pulled in below are genuinely portable despite their
; `platform/espidf/<name>/*.c` path (historical naming, not a real platform
; split -- see e.g. bb_log's own CMakeLists.txt comment "bb_log.c is
; portable ... but filed under platform/espidf/ for historical reasons; the
; host build needs it too"). `lib_extra_dirs` + PlatformIO's Library
; Dependency Finder (chain mode, the default) resolves each `#include` to
; the right candidate directory and compiles only what's transitively
; referenced -- so pointing it at the whole `.breadboard/components` tree
; (~100 entries) does NOT pull all of them in, only bb_fsm/bb_serialize/
; bb_json (stratum's actual deps) plus bb_core (headers only, no .c to
; compile).
;
; bb_tcp_client is deliberately never referenced from host-testable code --
; stratum's ESP-only transport backend (stratum_transport_esp.c) is guarded
; by #ifdef ESP_PLATFORM and compiles to an empty TU on host; host tests
; inject their own fake stratum_transport_ops_t instead (see
; stratum_transport.h's header comment) rather than pulling bb_tcp_client's
; own host backend and its PRIV_REQUIRES chain (bb_nv, bb_transport_health)
; in just for FSM tests.
platform = native
test_framework = unity
test_filter = test_host
extra_scripts =
    pre:scripts/fetch_breadboard.py
    pre:scripts/native_link_bb_json.py
lib_extra_dirs =
    .breadboard/components
    components
lib_deps =
    https://github.com/DaveGamble/cJSON.git#v1.7.18
build_flags =
    -O0
    -std=gnu11
    -DUNITY_INCLUDE_DOUBLE
    -Isrc
    -I.breadboard/platform/host/bb_json
    -DCONFIG_BB_FSM_MAX_TIMERS=3
build_src_filter =
    +<*>
    -<main.c>
