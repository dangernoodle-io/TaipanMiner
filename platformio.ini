[platformio]
default_envs = esp32-wroom32

[env:esp32-wroom32]
; Floor skeleton — bbtool codegen-composed root (see src/main.c,
; src/tm_wire.h, bbtool.toml). Boot + log + NVS + WiFi (STA from stored
; creds) only. No HTTP/OTA/provisioning/mining/stratum/ASIC/display/LED/
; webui yet. scripts/tm_codegen.py regenerates src/generated/ before
; every build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_esp32_4mb.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DFIRMWARE_BOARD=esp32-wroom32 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig/esp32-classic;sdkconfig/esp32-wroom32"
build_flags =
    -O3
    -ffunction-sections
    -fdata-sections
    -DBOARD_ESP32_WROOM32
    -DBB_HW_BOARD_HEADER=\"boards/esp32_wroom32.h\"
extra_scripts =
    pre:scripts/fetch_breadboard.py
    pre:.breadboard/scripts/bbtool_pio.py
    pre:scripts/tm_codegen.py
check_flags =
    cppcheck: --suppress=unusedFunction

[env:native]
; Host test env — FUTURE host-testable boundary (not yet live at floor base).
; The native/host-test seam is NOT yet active: test_build_src is unset, so
; src/ never compiles under native, and bb include paths are also absent.
; The first PR adding test/test_host/test_*.c must set test_build_src = yes
; and add required -I.breadboard/components/<name>/include paths (and any
; lib_extra_dirs) before src/ compiles on host. Do not add test_build_src here.
; Always exclude -<main.c> (ESP-IDF entry point).
platform = native
test_framework = unity
test_filter = test_host
extra_scripts =
    pre:scripts/fetch_breadboard.py
build_flags =
    -O0
    -std=gnu11
    -Isrc
build_src_filter =
    +<*>
    -<main.c>
