[platformio]
default_envs = esp32-wroom32

[env:esp32-wroom32]
; PR 1 skeleton — handwired composition root, boot + log only. No NVS/WiFi
; (blocked on breadboard B1-840 -- see src/main.c) /HTTP/OTA/provisioning/
; mining/stratum/ASIC/display/LED/webui yet.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_esp32_4mb.csv
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults
board_build.cmake_extra_args = -DFIRMWARE_BOARD=esp32-wroom32 -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig/esp32-classic;sdkconfig/esp32-wroom32"
build_flags =
    -O3
    -ffunction-sections
    -fdata-sections
    -DBOARD_ESP32_WROOM32
    -DBB_HW_BOARD_HEADER=\"boards/esp32_wroom32.h\"
extra_scripts =
    pre:scripts/fetch_breadboard.py
    pre:.breadboard/scripts/bbtool_pio.py
check_flags =
    cppcheck: --suppress=unusedFunction

[env:native]
; Host test env — the build_src_filter boundary for later PRs' host-testable
; seams (stratum/mining decode+parse). Empty for PR 1: src/main.c is
; ESP-IDF-only (app_main + bb_log/bb_system), so nothing here is host-buildable
; yet. Zero tests is expected until a later PR adds test/test_host/*.
platform = native
test_framework = unity
test_filter = test_host
extra_scripts =
    pre:scripts/fetch_breadboard.py
build_flags =
    -O0
    -std=gnu11
    -Isrc
build_src_filter =
    +<*>
    -<main.c>
